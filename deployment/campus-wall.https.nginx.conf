user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $campus_wall_connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name campus-wall.me;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://campus-wall.me$request_uri;
        }
    }
    server {
        # Public HTTPS site; certificate must exist before enabling this configuration.
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/campus-wall.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/campus-wall.me/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:CampusWallSSL:10m;
        ssl_session_timeout 1d;
        server_name campus-wall.me;
        root /var/www/campus-wall;
        index index.html;

        access_log /var/log/nginx/campus-wall.access.log;

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $campus_wall_connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }

        location /assets/ {
            try_files $uri =404;
            expires 7d;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
